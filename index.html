<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ToiletKort – offentlige toiletter i Danmark</title>
    <meta name="description" content="Et gratis, åbent kort over offentlige toiletter i Danmark, bygget på OpenStreetMap." data-i18n-content="app.description" />
    <meta name="theme-color" content="#0b5d66" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ToiletKort" />
    <link rel="preload" href="/api/toilets" as="fetch" crossorigin="anonymous" />
  </head>
  <body class="app">
    <a class="skip-link" href="#list" id="skip-to-list" data-i18n="skip.toList">Gå til listen over nærmeste toiletter</a>

    <header class="topbar">
      <a class="brand" href="/">
        <img src="/icon.svg" alt="" width="28" height="28" />
        <span class="brand-text"><span data-i18n="app.name">ToiletKort</span><span class="brand-tagline" data-i18n="app.tagline">Offentlige toiletter i Danmark</span></span>
      </a>
      <nav class="topnav">
        <a href="/om" data-i18n="nav.aboutShort" data-i18n-title="nav.about">Om</a>
        <button type="button" id="lang-toggle" class="lang-toggle" data-i18n="lang.switch" data-i18n-aria-label="lang.switchLabel">English</button>
      </nav>
    </header>

    <main id="main" class="layout">
      <div class="controls">
        <form id="search-form" class="search" role="search">
          <label for="search-input" class="visually-hidden" data-i18n="search.label">Søg på adresse eller by</label>
          <input id="search-input" type="search" name="q" autocomplete="off" enterkeyhint="search" maxlength="150" data-i18n-placeholder="search.placeholder" placeholder="Adresse eller by" />
          <button type="submit" class="btn btn-primary" data-i18n="search.submit">Søg</button>
        </form>
        <div id="search-results" class="search-results" aria-live="polite"></div>

        <div class="toolbar">
          <div class="segmented" role="group" data-i18n-aria-label="view.label" aria-label="Visning">
            <button type="button" id="view-map" aria-pressed="true" data-i18n="view.map">Kort</button>
            <button type="button" id="view-list" aria-pressed="false" data-i18n="view.list">Liste</button>
          </div>
          <button type="button" id="filters-btn" class="btn" aria-haspopup="dialog">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M3 5h18l-7 8v6l-4-2v-4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            <span id="filters-btn-label" data-i18n="filters.button">Filtre</span>
          </button>
          <button type="button" id="locate-btn" class="btn">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="currentColor" stroke-width="2"/></svg>
            <span data-i18n="locate.button">Min position</span>
          </button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>

      <section id="map-view" class="map-view" data-i18n-aria-label="map.label" aria-label="Kort over toiletter">
        <div id="map"></div>
      </section>

      <section id="list" class="list-view" tabindex="-1" aria-labelledby="list-title" hidden>
        <h1 id="list-title" class="list-title" data-i18n="list.title">Nærmeste toiletter</h1>
        <p id="list-origin" class="list-origin"></p>
        <ol id="list-items" class="list-items"></ol>
        <button type="button" id="list-more" class="btn btn-wide" hidden data-i18n="list.more">Vis flere</button>
      </section>
    </main>

    <footer class="credit">
      <a href="https://www.openstreetmap.org/copyright" data-i18n="footer.credit">Kortdata © OpenStreetMap-bidragydere, ODbL</a>
      · <a href="/om" data-i18n="nav.about">Om, licens og privatliv</a>
    </footer>

    <dialog id="filters" class="sheet" aria-labelledby="filters-title">
      <form method="dialog" class="sheet-inner" id="filters-form">
        <div class="sheet-head">
          <h2 id="filters-title" data-i18n="filters.title">Filtre</h2>
          <button type="button" class="icon-btn" id="filters-x" data-i18n-aria-label="detail.close" aria-label="Luk">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <fieldset class="checks">
          <legend class="visually-hidden" data-i18n="filters.title">Filtre</legend>
          <label class="check"><input type="checkbox" name="openNow" /> <span data-i18n="filters.openNow">Åbent nu</span></label>
          <label class="check"><input type="checkbox" name="free" /> <span data-i18n="filters.free">Gratis</span></label>
          <label class="check"><input type="checkbox" name="wheelchair" /> <span data-i18n="filters.wheelchair">Handicapadgang</span></label>
          <label class="check"><input type="checkbox" name="changingTable" /> <span data-i18n="filters.changingTable">Puslebord</span></label>
        </fieldset>
        <fieldset class="checks">
          <legend data-i18n="filters.category">Adgang</legend>
          <label class="check"><input type="checkbox" name="category" value="public" checked /> <span data-i18n="category.public">Offentligt</span></label>
          <label class="check"><input type="checkbox" name="category" value="customers" /> <span data-i18n="category.customers">For kunder</span></label>
          <label class="check"><input type="checkbox" name="category" value="permission" /> <span data-i18n="category.permission">Åbent for alle efter aftale</span></label>
          <p class="hint" data-i18n="category.emptyNote"></p>
        </fieldset>
        <fieldset class="checks">
          <legend class="visually-hidden" data-i18n="filters.hideUnknown"></legend>
          <label class="check"><input type="checkbox" name="hideUnknown" aria-describedby="unknown-help" /> <span data-i18n="filters.hideUnknown">Skjul ukendte</span></label>
          <p class="hint" id="unknown-help" data-i18n="filters.unknownHelp"></p>
        </fieldset>
        <p id="filters-status" class="hint" role="status"></p>
        <div class="sheet-actions">
          <button type="button" id="filters-reset" class="btn" data-i18n="filters.reset">Nulstil</button>
          <button type="submit" class="btn btn-primary" id="filters-done" data-i18n="filters.close">Vis toiletter</button>
        </div>
      </form>
    </dialog>

    <dialog id="detail" class="sheet" aria-labelledby="detail-title">
      <div class="sheet-inner">
        <div class="sheet-head">
          <h2 id="detail-title"></h2>
          <button type="button" class="icon-btn" id="detail-x" data-i18n-aria-label="detail.close" aria-label="Luk">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <p id="detail-summary" class="detail-summary"></p>
        <div class="detail-actions">
          <a id="detail-route" class="btn btn-primary" target="_blank" rel="noopener">
            <span data-i18n="detail.route">Rutevejledning</span>
          </a>
        </div>
        <dl id="detail-fields" class="fields"></dl>
        <div class="detail-edit">
          <a id="detail-edit" target="_blank" rel="noopener" data-i18n="detail.editOsm">Ret på OpenStreetMap</a>
          <p class="hint" data-i18n="detail.editOsmHint"></p>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
